# dsh-memory-pg 的 bundle 补丁：把插件作为一行插进 profile 的插件树。
#
# 安装三步（详见 README）：
#   1. dsh plugin --profile <name> add dsh-memory-pg
#   2. 把 "dsh-memory-pg" 加进该 profile package.json 的 dsh.profile.bundles
#   3. 在本文件同级的位置覆盖 projectRoot（见下）—— 或者更推荐的做法：
#      在 profile 自己的 cordis.patch.yml（用户覆盖层）里覆盖 id=memory-pg 的 config
#   4. 重启 dsh
#
# ⚠️ projectRoot 是**必填**，且**没有有意义的默认值**：它指向你自己的记忆库项目
#    目录（含 app/ 与 .pylibs/ 的那个）。这里故意留成占位符 —— 装完不改就会在启动时
#    明确报 schema 错误，而不是静默地去连一个不存在的库。
#
# 补丁会**整块替换**目标行的 config（不合并），所以在用户覆盖层里改配置时，
# 要把需要的键都写上。
- insert:
    - id: memory-pg
      name: dsh-memory-pg
      config:
        projectRoot: '/path/to/your/memory-project'   # ← 必须改成你的记忆库目录
        userId: owner
        # dsn: 'postgresql://user:pass@127.0.0.1:5432/mem'  # 留空用子进程环境的 MEM_PG_DSN
        pythonExe: python
        tools: true
        autoContext: true
        contextBudget: 900
        factLimit: 10
        includeTasks: true
        refreshSteps: 0

        # ---- 用哪一张库（v0.2.0 新增）------------------------------------
        #   local  = 只用本机库（默认，行为和以前完全一样）
        #   server = 只用服务器上的库：自动拉 SSH 本地端口转发，本机库一个字节都不动
        #   both   = 读写本机库，再用 memory_sync / syncAuto 与服务器双向同步
        target: local
        # serverHost: '203.0.113.10'       # 不给就用环境变量 DSH_SSH_HOST
        # serverUser: root
        # serverPort: 22
        # serverKeyFile: '/path/to/id_rsa' # 不给则找 syncScript 旁边的 run/sync/ssh/id_rsa
        # serverPassword: ''               # 没有可用私钥时的回退（可用 DSH_SSH_PASS）
        serverDsn: 'postgresql://mem:mem@127.0.0.1:5432/mem'
        tunnelPort: 15432

        # ---- 同步脚本（memory_sync 工具）-----------------------------------
        # syncScript: '/path/to/shell/proactive/tools/sync_mem.py'
        syncAuto: false
        syncTimeoutMs: 600000
        # pythonPath: '/path/to/channels/pylibs'  # paramiko 不在系统 python 里时用它
